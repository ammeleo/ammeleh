<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>esercizio DOM</title>

  <!-- JavaScript nell'header -->
  <script>
    function cambiaColore() {
      document.body.style.backgroundColor = "lightblue";
    }
  </script>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body onload="alert('benvenuto nella pagina!')">

  <h1 id="titolo">DOM</h1>
  <p id="descrizione">Questa pagina mostra il tony boy</p>

  <!-- Inline event -->
  <button onclick="cambiaColore()">Cambia colore sfondo</button>

  <button id="btnTesto">Cambia testo titolo</button>
  <input id="inputNome" placeholder="scrivi il tuo nome">
  <button id="btnSaluta">invia</button>

  <p id="output"></p>

  <img id="immagine" src="https://d2fa23zcjd5klo.cloudfront.net/square/performer/6a62dbf3-c06a-4c9e-b36c-f774f64d11b5.jpg" alt="Immagine esempio">

</body>
</html>
